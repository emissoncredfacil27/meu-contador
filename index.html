</style></head><body><header><div class="brand"><div><strong><b class="logo">✓</b>Meu Contador</strong><div class="sub">Seu próximo passo, com clareza.</div></div><div><button onclick="theme()" aria-label="Alternar tema">◐</button> <button onclick="go('config')" aria-label="Configurações">⚙</button></div></div><div class="switch"><button id="pf" onclick="profile('pf')">Pessoa Física · CPF</button><button id="pj" onclick="profile('pj')">Empresa · CNPJ</button></div></header><main id="app"></main><aside class="notice-fixed">As informações são orientativas e não substituem um contador registrado. Confirme prazos e regras nos canais oficiais.</aside><nav id="nav"></nav><dialog id="modal"></dialog><div id="toast" hidden role="status"></div>
<script>
'use strict';
/* EDITE: dados iniciais em fresh(); regras e fontes em SOURCES, CHECKS e obligations().
   Nenhuma requisição de rede é feita. Links oficiais só abrem por ação do usuário.
   O banco inteiro é cifrado por AES-GCM quando a senha é ativada. A senha não é armazenada.
   Arquivo único: não registra service worker; não promete cache offline nem push em segundo plano. */
const KEY='meu-contador-v1', $=id=>document.getElementById(id), money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), today=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}, month=()=>today().slice(0,7), date=s=>s?new Date(s+'T12:00:00').toLocaleDateString('pt-BR'):'Não confirmado', uid=()=>crypto.randomUUID(), link=(url,text='Abrir canal oficial')=>`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(text)} ↗</a>`;
const SOURCES={receita:'https://www.gov.br/receitafederal/pt-br',ir:'https://www.gov.br/receitafederal/pt-br/assuntos/meu-imposto-de-renda',tabela:'https://www.gov.br/receitafederal/pt-br/assuntos/meu-imposto-de-renda/tabelas/2026',mei:'https://www.gov.br/empresas-e-negocios/pt-br/empreendedor/perguntas-frequentes',simples:'https://www8.receita.fazenda.gov.br/SimplesNacional/',pgfn:'https://www.regularize.pgfn.gov.br/',inss:'https://meu.inss.gov.br/',fgts:'https://www.gov.br/trabalho-e-emprego/pt-br/servicos/empregador/fgtsdigital',nf:'https://www.gov.br/nfse/pt-br',esocial:'https://www.gov.br/esocial/pt-br',eleitor:'https://www.tse.jus.br/servicos-eleitorais',gov:'https://www.gov.br/governodigital/pt-br/identidade/conta-gov-br',cnd:'https://www.gov.br/receitafederal/pt-br/assuntos/certidoes',cndt:'https://www.tst.jus.br/certidao1'};
const CHECKS={pf:[['cpf','Consultar situação cadastral do CPF','CPF regular não comprova ausência de débitos. Consulte também a situação fiscal na Receita.','receita',1],['fiscal','Consultar pendências na Receita e PGFN','Entre com gov.br, obtenha o relatório de situação fiscal e verifique omissões, débitos e intimações.','receita',1],['gov','Conferir acesso gov.br prata/ouro','Nível de acesso a serviços; não é obrigação tributária universal. Ative verificação em duas etapas.','gov',2],['eleitor','Consultar título de eleitor','Verifique quitação e regularize eventuais pendências na Justiça Eleitoral.','eleitor',3],['cert','Emitir certidões pertinentes','Confira certidão federal e, conforme bens/atividade, estadual e municipal.','cnd',2],['credito','Revisar Serasa/SPC','Situação de crédito é diferente de regularidade fiscal. Consulte diretamente os birôs, sem pagar intermediários desconhecidos.','receita',3],['docs','Atualizar documentos e comprovantes','Confira validade, endereço, informes de rendimentos e recibos.','gov',3]],pj:[['cnpj','Consultar CNPJ e enquadramento','Confira situação ativa, CNAEs, endereço, sócios e opção tributária. ME/EPP são portes, não regimes.','receita',1],['fiscal','Levantar dívidas e declarações omitidas','Obtenha diagnóstico na Receita e PGFN; débitos estaduais e municipais exigem consulta própria.','receita',1],['cadastro','Conferir CNAE e inscrições','Verifique inscrição municipal e estadual conforme atividade, regime e legislação local.','simples',1],['alvara','Conferir alvará e licenças','A exigência ou dispensa depende de risco, CNAE, endereço e regras locais. Valide na prefeitura, Vigilância Sanitária, Bombeiros e órgão ambiental.','mei',2],['digital','Conferir certificado digital','Valide exigência no regime e nos emissores utilizados. Não é obrigatório em todos os casos.','receita',2],['conta','Separar conta PJ e finanças do dono','Registre pró-labore, lucros, aportes e reembolsos separadamente.','simples',2],['cert','Revisar certidões federal, estadual e municipal','Confira validade e autenticidade nos respectivos órgãos.','cnd',2],['fgts','Consultar regularidade do FGTS','Verifique CRF e guias conforme vínculo e obrigações aplicáveis.','fgts',2],['trabalhista','Consultar certidão trabalhista','Emita CNDT e examine pendências quando necessário.','cndt',2]]};
function fresh(){return {version:1,p:'pf',dark:false,profiles:{pf:{name:'Ana Exemplo',state:'BA',city:'Salvador',situation:'Autônomo',individual:true,foreign:false,dependents:1,assets:true,investments:false,debts:true,diagnosed:false,goal:500},pj:{name:'Empresa Exemplo',state:'BA',city:'Salvador',type:'MEI',regime:'SIMEI',cnae:'',billing:6000,employees:0,notes:true,debts:false,diagnosed:false,opened:'2026-01-01',activity:'Serviços'}},checks:{pf:{},pj:{}},done:{},tasks:[],tx:[{id:'ex1',p:'pf',name:'Serviço — exemplo',value:4500,date:month()+'-05',kind:'Receita',cat:'Extra',paid:true},{id:'ex2',p:'pf',name:'Moradia — exemplo',value:1500,date:month()+'-10',kind:'Despesa',cat:'Fixo',paid:true},{id:'ex3',p:'pj',name:'Serviços — exemplo',value:6000,date:month()+'-05',kind:'Receita',cat:'Faturamento',paid:true}],debts:[],docs:[],notes:[],contacts:[],staff:[],chat:[],reportMonth:month()};}
let db,tab='inicio',cryptKey=null,envelope=null,writeQueue=Promise.resolve(),vaultOpen=false;
const p=()=>db.p, info=()=>db.profiles[p()], scoped=key=>db[key].filter(x=>x.p===p());
function toast(t){$('toast').textContent=t;$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,4200)}
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))), un64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pass,salt){return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']),{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function save(){const snapshot=JSON.stringify(db);writeQueue=writeQueue.catch(()=>{}).then(async()=>{try{if(cryptKey){const iv=crypto.getRandomValues(new Uint8Array(12)),data=await crypto.subtle.encrypt({name:'AES-GCM',iv},cryptKey,new TextEncoder().encode(snapshot));envelope={locked:true,salt:envelope.salt,iv:b64(iv),data:b64(data)};localStorage.setItem(KEY,JSON.stringify(envelope))}else localStorage.setItem(KEY,snapshot)}catch(e){toast('Falha ao salvar: armazenamento cheio ou indisponível. Exporte um backup.');throw e}});return writeQueue}
function profile(x){db.p=x;vaultOpen=false;save();render()}function go(x){tab=x;render();window.scrollTo(0,0)}function theme(){db.dark=!db.dark;save();render()}
function field(name,title,value='',type='text'){return `<label>${title}<input name="${name}" type="${type}" value="${esc(value)}" ${type==='number'?'step="0.01" min="0"':''}></label>`}function select(name,title,items,value){return `<label>${title}<select name="${name}">${items.map(x=>`<option ${x===value?'selected':''}>${esc(x)}</option>`).join('')}</select></label>`}function check(name,title,value){return `<label><input type="checkbox" name="${name}" ${value?'checked':''}>${title}</label>`}
function modal(title,body,submit){$('modal').innerHTML=`<form id="form"><div class="row"><h2>${title}</h2><button type="button" onclick="$('modal').close()" aria-label="Fechar">✕</button></div>${body}<div class="actions"><button class="primary" type="submit">Salvar</button><button type="button" onclick="$('modal').close()">Cancelar</button></div></form>`;$('form').onsubmit=async e=>{e.preventDefault();try{if(await submit(new FormData(e.target),e.target)!==false){await save();$('modal').close();render()}}catch(err){toast('Não foi possível concluir. '+err.message)}};$('modal').showModal()}
function diagnosis(){const i={...info()};modal('Diagnóstico · '+(p()==='pf'?'Pessoa Física':'Empresa'),`<p class="muted">Exemplos fictícios. Substitua pelos seus dados. Não é necessário informar CPF/CNPJ completo.</p><div class="cols">${field('name','Nome',i.name)}${field('state','Estado / UF',i.state)}${field('city','Município',i.city)}${p()==='pf'?select('situation','Situação',['CLT','Autônomo','Aposentado','Servidor','Empresário'],i.situation)+field('dependents','Dependentes',i.dependents,'number')+check('individual','Recebo de pessoa física',i.individual)+check('foreign','Recebo do exterior',i.foreign)+check('assets','Tenho imóveis ou veículos',i.assets)+check('investments','Tenho investimentos',i.investments):select('type','Porte / categoria',['MEI','ME','EPP'],i.type)+select('regime','Regime',['SIMEI','Simples Nacional','Lucro Presumido','Lucro Real'],i.regime)+field('cnae','CNAE principal',i.cnae)+field('billing','Faturamento mensal de referência',i.billing,'number')+field('employees','Quantidade de funcionários',i.employees,'number')+field('opened','Data de abertura',i.opened,'date')+select('activity','Atividade de referência',['Comércio','Indústria','Serviços','Comércio e Serviços'],i.activity)+check('notes','Emito notas fiscais',i.notes)}${check('debts','Tenho dívidas',i.debts)}</div>`,f=>{for(let [k,v]of f)i[k]=v;['individual','foreign','assets','investments','notes','debts'].forEach(k=>{if(k in i)i[k]=f.has(k)});['dependents','billing','employees'].forEach(k=>{if(k in i)i[k]=Number(f.get(k))});if(!i.name.trim()||i.state.length!==2){toast('Informe nome e UF com duas letras.');return false}if(p()==='pj'&&((i.type==='MEI')!==(i.regime==='SIMEI'))){toast('MEI deve usar SIMEI; ME/EPP devem selecionar outro regime.');return false}i.diagnosed=true;db.profiles[p()]=i})}
function checklist(){return CHECKS[p()].map(x=>({id:x[0],name:x[1],detail:x[2],url:SOURCES[x[3]],priority:x[4],status:db.checks[p()][x[0]]||'Pendente'}))}
function plan(){let list=checklist();const i=info();if(!i.diagnosed)list.unshift({id:'diagnostico',name:'Concluir diagnóstico inicial',detail:'Revise os exemplos e informe sua situação real.',priority:0,status:'Pendente'});return list.filter(x=>!['Concluído','Não se aplica'].includes(x.status)).sort((a,b)=>a.priority-b.priority)}
function obligations(){let y=+today().slice(0,4), m=+today().slice(5,7),arr=[],i=info();const add=(id,name,day,detail,url,priority=1)=>arr.push({id:p()+':'+id+':'+y+'-'+m,p:p(),name,date:`${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`,detail,url,priority,estimated:true});
if(p()==='pf'&&(i.individual||i.foreign))add('carne','Revisar Carnê-Leão',new Date(y,m,0).getDate(),'Apurar rendimentos do mês anterior no Carnê-Leão Web; DARF, quando devido, até o último dia útil do mês seguinte. Data mostrada é referência de fim de mês: confirme dia útil e feriados. Atrasos: emitir DARF atualizado no sistema oficial.',SOURCES.ir);
if(p()==='pf'&&i.situation==='Autônomo')add('inss','Conferir contribuição ao INSS',15,'GPS de contribuinte individual, quando aplicável: referência dia 15 do mês seguinte; confirme código, base, retenções e ajuste de dia não útil no Meu INSS. Guia em atraso deve ser recalculada no canal oficial.',SOURCES.inss);
if(p()==='pj'){if(i.type==='MEI')add('das','Apurar e pagar DAS-MEI',20,'DAS mensal pelo PGMEI. Confirme vencimento efetivo e eventuais prorrogações. Em atraso, reemita com acréscimos no PGMEI. DASN-SIMEI anual deve ser conferida no portal.',SOURCES.simples);else if(i.regime==='Simples Nacional')add('pgdas','Apurar PGDAS-D / DAS',20,'Informe receitas e segregações no PGDAS-D, inclusive sem movimento quando exigido. Confira vencimento do DAS no sistema. DEFIS é anual; verifique agenda. Multas e juros são calculados no portal.',SOURCES.simples);else add('tributos','Conferir apuração tributária',20,'Esta data é um lembrete de revisão, não vencimento legal. IRPJ/CSLL, PIS/Cofins, ISS/ICMS e obrigações acessórias têm regras próprias, inclusive transição da reforma tributária. Solicite agenda validada ao contador.',SOURCES.receita);
if(+i.employees>0){add('folha','Revisar folha e eSocial',15,'Referência para revisar fechamento, eventos, retenções e DCTFWeb. Não é prazo universal. Confirme datas de cada obrigação na agenda oficial; admissão, afastamento e rescisão têm prazos específicos.',SOURCES.esocial);add('fgts','Conferir FGTS e contribuição previdenciária',20,'FGTS mensal tem referência dia 20. Confirme antecipação de dia não útil, guias previdenciárias e exceções. MEI empregador: conferir DAE no eSocial. Multas devem ser obtidas nas guias oficiais.',SOURCES.fgts)}}return arr.concat(db.tasks.filter(x=>x.p===p())).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'))}
function done(x){return !!db.done[x.id]}function toggleTask(id){db.done[id]=!db.done[id];save();render()}function statusTask(x){return done(x)?'Concluído':!x.date?'Confirmar prazo':x.date<today()?'Revisar atraso':x.date===today()?'Hoje':'A vencer'}
function taskHTML(x){return `<div class="item"><div class="row"><div><b>${esc(x.name)}</b><div class="${!done(x)&&x.date<today()?'red':'muted'}">${date(x.date)} · ${statusTask(x)} ${x.estimated?'· referência a confirmar':''}</div></div><button onclick="toggleTask('${x.id}')">${done(x)?'↶ Reabrir':'✓ Marcar como feito'}</button></div><details><summary>O que é e como resolver</summary><p>${esc(x.detail)}</p>${x.url?link(x.url):''}${!x.estimated?`<button class="danger" onclick="remove('tasks','${x.id}')">Excluir</button>`:''}</details></div>`}
function stats(){let rows=scoped('tx').filter(x=>x.date.slice(0,7)===db.reportMonth&&x.paid),r=rows.filter(x=>x.kind==='Receita').reduce((s,x)=>s+x.value,0),e=rows.filter(x=>x.kind==='Despesa').reduce((s,x)=>s+x.value,0);return {r,e,s:r-e}}
function render(){document.body.classList.toggle('dark',db.dark);$('pf').classList.toggle('active',p()==='pf');$('pj').classList.toggle('active',p()==='pj');const nav=[['inicio','⌂','Início'],['plano','✓','Plano'],['financas','↗','Finanças'],['calendario','▦','Agenda'],['mais','⋯','Mais']];$('nav').innerHTML=nav.map(n=>`<button class="${tab===n[0]?'active':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('');const views={inicio:home,plano:planView,financas:finance,calendario:calendar,mais:more,tributos:taxes,cofre:vault,assistente:assistant,relatorios:reports,config:settings,empresa:business,dividas:debtsView,inss:inssView};$('app').innerHTML=`<h1 class="print-title">Meu Contador · ${esc(info().name)}</h1>`+(views[tab]||home)();}
function home(){let c=checklist().filter(x=>x.status!=='Não se aplica'),score=c.length?Math.round(c.filter(x=>x.status==='Concluído').length/c.length*100):0,s=stats(),o=obligations().filter(x=>!done(x)),pl=plan();return `<div class="row"><div><div class="sub">${p()==='pf'?'PESSOA FÍSICA':'EMPRESA'} · ${esc(info().city)} / ${esc(info().state)}</div><h1>${esc(info().name)}</h1></div><button onclick="diagnosis()">Editar diagnóstico</button></div>${!info().diagnosed?'<div class="card"><b class="yellow">Modo de demonstração · dados fictícios</b><p>Preencha o diagnóstico para personalizar seu plano.</p><button class="primary" onclick="diagnosis()">Começar diagnóstico</button></div>':''}<div class="card hero"><div class="row"><div><span class="tag">SAÚDE FISCAL · AUTOAVALIAÇÃO</span><div class="score">${score}<small> / 100</small></div><p class="muted">Progresso das verificações declaradas.<br>Não certifica regularidade nos órgãos públicos.</p></div><button class="primary" onclick="actionPlan()">O que devo fazer hoje? →</button></div></div><div class="grid">${[['Receitas recebidas',s.r],['Despesas pagas',s.e],['Saldo do mês',s.s],['Impostos · estimativa',estimate(s.r)]].map(x=>`<div class="card"><small>${x[0]}</small><div class="kpi">${x[1]===null?'A apurar':money(x[1])}</div></div>`).join('')}</div><p class="sub">Competência financeira: ${esc(db.reportMonth)}. Impostos: simulação básica; confira bases e deduções em Tributos.</p>${p()==='pj'?limitCard():''}<div class="card"><div class="row"><h2>Próximos passos</h2><button onclick="go('plano')">Ver plano</button></div>${pl.slice(0,3).map((x,i)=>`<div class="item"><span class="tag">${i+1} · Prioridade ${x.priority+1}</span><p><b>${esc(x.name)}</b></p><small>${esc(x.detail)}</small></div>`).join('')||'<p class="tag">Verificações registradas. Confira a validade dos comprovantes periodicamente.</p>'}</div><div class="card"><h2>Agenda e alertas</h2>${o.slice(0,3).map(taskHTML).join('')||'<p>Sem lembretes pendentes.</p>'}</div>`}
function planView(){return `<h1>Plano de regularização</h1><p class="muted">Ordenado por prioridade. Marque como concluído somente após consultar o órgão e guardar o comprovante. Itens não aplicáveis podem ser dispensados por você.</p><div class="actions"><button onclick="diagnosis()">Diagnóstico</button><button onclick="actionPlan()" class="primary">Plano de ação</button><button onclick="go('tributos')">Tributos</button></div><div class="card">${checklist().sort((a,b)=>a.priority-b.priority).map(x=>`<div class="item"><div class="row"><div><span class="tag">Prioridade ${x.priority}</span><h3>${esc(x.name)}</h3></div><select aria-label="Status ${esc(x.name)}" onchange="setCheck('${x.id}',this.value)">${['Pendente','Em andamento','Concluído','Não se aplica'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></div><p>${esc(x.detail)}</p>${link(x.url)}</div>`).join('')}</div><div class="card"><h2>Verificações adicionais para seu diagnóstico</h2>${p()==='pf'?`${info().individual||info().foreign?'<p>• Rendimentos de PF/exterior: avaliar Carnê-Leão e registro mensal.</p>':''}${info().assets?'<p>• Bens: reunir documentos de aquisição e verificar IPTU/IPVA nos órgãos locais.</p>':''}${info().investments?'<p>• Investimentos: obter informes e verificar renda variável, exterior e ganhos de capital.</p>':''}<p>Dependentes: ${esc(info().dependents)}. Inclua rendimentos e bens de cada dependente conforme regras.</p><button onclick="go('inss')">INSS e CNIS</button>`:'<p>CNAE, licenças e regras locais precisam de validação na prefeitura e SEFAZ do seu estado. Abra a área Empresa para notas, funcionários e contatos.</p><button onclick="go(\'empresa\')">Empresa</button>'}</div>`}function setCheck(id,v){db.checks[p()][id]=v;save();render()}
function actionPlan(){let a=plan(),o=obligations().filter(x=>!done(x));$('modal').innerHTML=`<h2>Seu plano de ação</h2><h3>Hoje</h3>${a.slice(0,2).map(x=>`<p>□ ${esc(x.name)} — ${esc(x.detail)}</p>`).join('')||'<p>Revisar comprovantes das tarefas concluídas.</p>'}<h3>Esta semana</h3>${o.slice(0,3).map(x=>`<p>□ ${esc(x.name)} · ${date(x.date)} (confirmar)</p>`).join('')||'<p>Revisar documentos e vencimentos.</p>'}<h3>Este mês</h3><p>Conciliar receitas/despesas, revisar dívidas, arquivar documentos e confirmar a agenda nos portais oficiais.</p><button onclick="$('modal').close();go('plano')" class="primary">Abrir checklist</button> <button onclick="$('modal').close()">Fechar</button>`;$('modal').showModal()}
function txForm(id){let x=db.tx.find(x=>x.id===id)||{name:'',value:'',date:today(),kind:'Despesa',cat:'Variável',paid:false};modal(id?'Editar lançamento':'Novo lançamento',`${field('name','Descrição',x.name)}<div class="cols">${field('value','Valor (R$)',x.value,'number')}${field('date','Vencimento / data',x.date,'date')}${select('kind','Natureza',['Receita','Despesa'],x.kind)}${select('cat','Categoria',['Fixo','Variável','Salário','Extra','Faturamento','Imposto','Pró-labore','Distribuição de lucros','Pessoal do dono'],x.cat)}</div>${check('paid','Pago / recebido',x.paid)}`,f=>{if(!f.get('name').trim()||+f.get('value')<=0||!f.get('date')){toast('Preencha descrição, valor positivo e data.');return false}let data={id:id||uid(),p:p(),name:f.get('name'),value:+f.get('value'),date:f.get('date'),kind:f.get('kind'),cat:f.get('cat'),paid:f.has('paid')};if(id)Object.assign(x,data);else db.tx.push(data)})}
function remove(key,id){if(!confirm('Excluir este registro?'))return;db[key]=db[key].filter(x=>x.id!==id);save();render()}
function changeMonth(v){db.reportMonth=v||month();save();render()}
function finance(){let s=stats(),rows=scoped('tx').filter(x=>x.date.slice(0,7)===db.reportMonth);return `<h1>Finanças</h1><div class="actions"><button class="primary" onclick="txForm()">+ Lançamento</button><button onclick="go('dividas')">Dívidas</button><button onclick="go('relatorios')">Relatórios</button></div><label>Mês<input type="month" value="${db.reportMonth}" onchange="changeMonth(this.value)"></label><div class="grid">${[['Recebido',s.r],['Pago',s.e],['Saldo',s.s]].map(x=>`<div class="card"><small>${x[0]}</small><div class="kpi">${x[1]===null?'A apurar':money(x[1])}</div></div>`).join('')}</div><div class="card"><h2>Entradas e saídas realizadas</h2>${[['Receitas',s.r],['Despesas',s.e]].map(x=>`<p>${x[0]} · ${money(x[1])}</p><div class="bar" style="width:${Math.max(1,x[1]/Math.max(s.r,s.e,1)*100)}%"></div>`).join('')}<label>Meta de economia (R$)<input type="number" min="0" value="${info().goal||0}" onchange="info().goal=+this.value;save();render()"></label><p>Progresso: ${info().goal?Math.max(0,Math.round(s.s/info().goal*100)):0}% da meta.</p></div><div class="card scroll"><table><thead><tr><th>Descrição</th><th>Vencimento</th><th>Valor</th><th>Status</th><th>Ações</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.name)}<br><small>${esc(x.kind)} · ${esc(x.cat)}</small></td><td>${date(x.date)}</td><td>${money(x.value)}</td><td class="${!x.paid&&x.date<today()?'red':''}">${x.paid?'Realizado':x.date<today()?'Vencido':x.date===today()?'Vence hoje':'Pendente'}</td><td><button onclick="txForm('${x.id}')">Editar</button> <button onclick="paid('${x.id}')">${x.paid?'Desfazer':'Baixar'}</button> <button onclick="remove('tx','${x.id}')" class="danger">Excluir</button></td></tr>`).join('')||'<tr><td colspan="5">Sem lançamentos neste mês.</td></tr>'}</tbody></table></div>`}function paid(id){let x=db.tx.find(x=>x.id===id);x.paid=!x.paid;save();render()}
function debtForm(){modal('Nova dívida',`${field('name','Credor / descrição')}${select('organ','Órgão / credor',['Receita','PGFN','Estado','Município','FGTS','Banco / outros'],'Receita')}<div class="cols">${field('value','Saldo devedor',0,'number')}${field('rate','Juros efetivos ao mês (%)',0,'number')}${field('installment','Parcela mensal',0,'number')}${field('date','Próximo vencimento',today(),'date')}</div>${field('risk','Risco imediato (penhora, corte, garantia etc.)')}`,f=>{if(!f.get('name').trim()||+f.get('value')<=0)return false;db.debts.push({id:uid(),p:p(),name:f.get('name'),organ:f.get('organ'),value:+f.get('value'),rate:+f.get('rate'),installment:+f.get('installment'),date:f.get('date'),risk:f.get('risk')})})}
function debtsView(){let rows=scoped('debts').sort((a,b)=>Number(!!b.risk)-Number(!!a.risk)||b.rate-a.rate);return `<h1>Dívidas e parcelamentos</h1><p>Prioridade sugerida: risco imediato primeiro; depois maior juro efetivo. Preserve despesas essenciais e confirme o custo total da negociação.</p><button class="primary" onclick="debtForm()">+ Dívida</button><div class="card">${rows.map((x,i)=>`<div class="item"><span class="tag">Prioridade ${i+1}</span><h3>${esc(x.name)} · ${esc(x.organ)}</h3><p>${money(x.value)} · ${x.rate}% a.m. · parcela ${money(x.installment)} · ${date(x.date)}</p><p class="red">${esc(x.risk)}</p>${link(x.organ==='PGFN'?SOURCES.pgfn:x.organ==='FGTS'?SOURCES.fgts:SOURCES.receita,'Consultar negociação')} <button onclick="remove('debts','${x.id}')">Excluir</button></div>`).join('')||'<p>Nenhuma dívida cadastrada.</p>'}</div><div class="card"><h2>Como regularizar</h2><p>Receita: diagnosticar e parcelar débitos ainda não inscritos. PGFN: negociar dívida ativa no Regularize. Estado e município: solicitar extrato e opções na SEFAZ/prefeitura. FGTS: verificar canais da Caixa/FGTS Digital conforme período e natureza do débito.</p><p>O aplicativo não negocia, emite guias nem confirma pagamento automaticamente.</p>${link(SOURCES.pgfn,'Regularize / PGFN')}</div>`}
function calendar(){return `<h1>Calendário fiscal</h1><p class="muted">Referências mensais não são confirmação legal de prazo. Cadastre também obrigações anuais e locais após consultar a agenda oficial.</p><div class="actions"><button class="primary" onclick="taskForm()">+ Obrigação / prazo confirmado</button><button onclick="notify()">Ativar lembrete nesta sessão</button></div><div class="card">${obligations().map(taskHTML).join('')||'<p>Cadastre um vencimento.</p>'}</div><p>Alertas são exibidos ao abrir ou manter o app aberto. Este arquivo não agenda notificações com o app fechado no iPhone.</p>${link(SOURCES.receita,'Conferir agenda da Receita')}`}
function taskForm(){modal('Cadastrar obrigação',`${field('name','Nome da obrigação')}${field('date','Vencimento confirmado','','date')}<label>Como pagar, multa e fonte consultada<textarea name="detail" required></textarea></label>`,f=>{if(!f.get('name').trim()||!f.get('date'))return false;db.tasks.push({id:uid(),p:p(),name:f.get('name'),date:f.get('date'),detail:f.get('detail'),estimated:false})})}
async function notify(){if(!('Notification'in window)){toast('Notificações indisponíveis. Use os alertas na agenda.');return}try{let permission=await Notification.requestPermission();if(permission==='granted'){new Notification('Meu Contador',{body:'Confira os próximos prazos na agenda. Lembretes só funcionam com o app aberto.'});toast('Permissão concedida. Alertas de sessão ativados.')}else toast('Permissão não concedida.')}catch(e){toast('Este navegador não permite notificações neste formato.')}}
// IRPF 2026 mensal e anual (exercício 2027). Não usar para declaração do ano-base 2025.
function progressive(base,annual=false){let lim=annual?[29145.6,33919.8,45012.6,55976.16]:[2428.8,2826.65,3751.05,4664.68],ded=annual?[0,2185.92,4729.91,8105.85,10904.66]:[0,182.16,394.16,675.49,908.73],rates=[0,.075,.15,.225,.275],idx=lim.findIndex(v=>base<=v);if(idx<0)idx=4;return Math.max(0,base*rates[idx]-ded[idx])}
function incomeTax(gross,deductions,annual=false){let initial=progressive(Math.max(0,gross-deductions),annual),reduction=annual?(gross<=60000?2694.15:gross<=88200?Math.max(0,8429.73-.095575*gross):0):(gross<=5000?312.89:gross<=7350?Math.max(0,978.62-.133145*gross):0);return Math.round(Math.max(0,initial-reduction)*100)/100}
function meiTax(){return 81.05+(info().activity==='Serviços'?5:info().activity==='Comércio e Serviços'?6:1)}function estimate(r){return p()==='pf'?incomeTax(r,607.2):info().type==='MEI'?meiTax():null}
function limitCard(){let year=today().slice(0,4),total=scoped('tx').filter(x=>x.kind==='Receita'&&x.cat==='Faturamento'&&x.date.startsWith(year)).reduce((s,x)=>s+x.value,0),i=info(),limit=i.type==='MEI'?81000:4800000;if(i.type==='MEI'&&i.opened&&i.opened.startsWith(year))limit=6750*(13-Number(i.opened.slice(5,7)));let pct=total/limit*100;return `<div class="card"><h2>Faturamento ${year}</h2><div class="row"><b>${money(total)} / ${money(limit)}</b><span class="${pct>=100?'red':pct>=80?'yellow':''}">${pct.toFixed(1)}%</span></div><div class="progress"><i style="width:${Math.min(pct,100)}%;${pct>=100?'background:var(--red)':''}"></i></div><p class="muted">Base: lançamentos de receita na categoria Faturamento, pagos ou não; não duplica notas registradas. ${i.type==='MEI'?'MEI comum: R$ 81 mil/ano, proporcional no ano de abertura; MEI Caminhoneiro tem regra própria não simulada.':'Referência de limite geral do Simples: R$ 4,8 milhões/ano. Início de atividade, sublimites e receita externa exigem análise separada.'}</p>${pct>=80?'<p class="red">Atenção ao limite: confira enquadramento e efeitos do excesso com contador antes de novas decisões.</p>':''}</div>`}
function taxes(){return `<h1>${p()==='pf'?'Imposto de Renda e Carnê-Leão':'Tributos e regimes'}</h1><div class="card"><h2>Regras e fontes</h2><p>Referência: ano-calendário 2026. Estimativas não emitem guias. A declaração entregue em 2026 refere-se, em regra, a 2025: não use a tabela de 2026 para apurá-la. Prazos anuais devem ser conferidos e registrados na Agenda.</p>${link(SOURCES.tabela,'Tabelas oficiais 2026')} · ${link(SOURCES.simples,'Simples Nacional')} · ${link(SOURCES.mei,'Regras MEI')}</div>${p()==='pf'?`<div class="card"><h2>Simulador IRPF · 2026</h2><p>Compara deduções legais e desconto simplificado. Cenário básico de rendimentos tributáveis comuns; não inclui imposto mínimo de altas rendas, tributação exclusiva, exterior, ganhos de capital ou compensações especiais.</p><form onsubmit="event.preventDefault();calcIR(this)"><div class="cols">${select('period','Período',['Mensal / Carnê-Leão','Anual / declaração 2027'],'Mensal / Carnê-Leão')}${field('gross','Rendimentos tributáveis (brutos)',6000,'number')}${field('deductions','Deduções legais permitidas (total)',0,'number')}${field('withheld','IR retido / antecipado',0,'number')}</div><button class="primary">Comparar</button></form><div id="irResult" role="status"></div><p class="sub">Deduções informadas são responsabilidade do usuário. Livro-caixa, INSS, dependentes, saúde e educação têm critérios e limites diferentes.</p></div><div class="card"><h2>Estou obrigado a declarar?</h2><p>Dados insuficientes para verificar somente com este diagnóstico. Reúna rendimentos tributáveis/isentos, patrimônio, operações em bolsa, ganhos de capital, atividade rural, residência fiscal e informações do exterior; compare todos os critérios do exercício no portal oficial.</p>${link(SOURCES.ir,'Verificar obrigatoriedade e calendário')}<h3>Documentos para reunir</h3><p>Informes de todas as fontes e bancos; CPF dos dependentes; comprovantes médicos identificados; educação; contribuições; bens, saldos, dívidas e transações; DARFs e recibo anterior.</p><h3>Evitar malha fina</h3><p>Compare a pré-preenchida com documentos; inclua renda de dependentes; confira CPF/CNPJ e valores; mantenha recibos. Despesa sem previsão legal não é dedutível.</p><h3>Carnê-Leão</h3><p>Registre mensalmente rendimentos tributáveis recebidos de pessoas físicas e do exterior quando sujeitos ao recolhimento. Apure no Carnê-Leão Web e gere DARF quando devido. Moeda estrangeira, livro-caixa e compensações precisam de análise específica.</p>${link(SOURCES.ir,'Apuração, restituição e extrato de processamento')}</div>`:`${limitCard()}<div class="card"><h2>Comparador de cenários tributários</h2><p>Simulação parametrizada, sem recomendar regime. CNAE, anexo, fator R, retenções, ISS/ICMS, adicionais e reforma tributária podem mudar o resultado. Não calcula Lucro Real.</p><form onsubmit="event.preventDefault();calcPJ(this)"><div class="cols">${field('rev','Receita mensal',info().billing,'number')}${field('r12','Receita acumulada em 12 meses (RBT12)',72000,'number')}${field('rate','Alíquota nominal do anexo Simples (%)',6,'number')}${field('ded','Parcela a deduzir do anexo (R$)',0,'number')}${field('pres','Carga global estimada Lucro Presumido (%)',13.33,'number')}${field('extra','Encargos / tributos fora da estimativa (R$)',0,'number')}</div><button class="primary">Comparar cenários</button></form><div id="pjResult"></div></div><div class="card"><h2>Obrigações por regime</h2><p><b>MEI:</b> DAS mensal e DASN-SIMEI anual. Emitir pelo portal; atraso exige recálculo. DAS estimado 2026 da atividade informada: ${money(meiTax())}, exceto situações especiais como caminhoneiro.</p><p><b>Simples:</b> PGDAS-D/DAS, DEFIS e demais obrigações aplicáveis. Confira anexo, fator R e segregação de receitas.</p><p><b>Presumido:</b> IRPJ/CSLL, PIS/Cofins e tributos locais conforme atividade; avaliar ECF, ECD, EFD-Contribuições, DCTFWeb/MIT e demais exigências. Não há uma única guia ou data universal.</p><p><b>Folha:</b> eSocial, previdência, FGTS e retenções variam conforme empregador e vínculos. Multas, juros e guias devem vir do sistema oficial.</p>${link(SOURCES.receita,'Confirmar obrigações e multas')}</div>`}`}
function calcIR(form){let f=new FormData(form),gross=+f.get('gross'),d=+f.get('deductions'),w=+f.get('withheld'),annual=f.get('period').startsWith('Anual'),simple=annual?Math.min(gross*.2,17640):607.2,a=incomeTax(gross,d,annual),b=incomeTax(gross,simple,annual);$('irResult').innerHTML=`<div class="notice"><p>Deduções legais: ${money(a)} · Simplificado: ${money(b)}</p><p>Menor imposto estimado: <b>${money(Math.min(a,b))}</b> (${a<b?'deduções legais':'simplificado'}).</p><p>Após IR antecipado informado: ${money(Math.min(a,b)-w)}. Valor negativo representa possível crédito na simulação; não confirma restituição.</p></div>`}
function calcPJ(form){let f=new FormData(form),r=+f.get('rev'),r12=+f.get('r12'),rate=+f.get('rate'),ded=+f.get('ded'),extra=+f.get('extra');if(r12<=0||rate>100||+f.get('pres')>100){toast('Revise RBT12 e alíquotas.');return}let eff=Math.max(0,(r12*rate/100-ded)/r12),sn=r*eff+extra,lp=r*(+f.get('pres')/100)+extra;$('pjResult').innerHTML=`<div class="notice"><p>Simples parametrizado: ${money(sn)} · alíquota efetiva ${(eff*100).toFixed(2)}%.</p><p>Presumido com carga informada: ${money(lp)}.</p><p>Diferença mensal: ${money(Math.abs(sn-lp))}. Elegibilidade e carga real não validadas. No MEI, limite e ocupação permitida são obrigatórios; não é uma opção livre apenas pelo menor valor.</p></div>`}
function inssView(){return `<h1>INSS e aposentadoria</h1><div class="card"><h2>Seu próximo passo</h2><p>1. Entre no Meu INSS e baixe o Extrato de Contribuição (CNIS).</p><p>2. Confira vínculos, salários, recolhimentos e indicadores de pendência.</p><p>3. Reúna carnês, comprovantes, carteira de trabalho e documentos dos períodos divergentes.</p><p>4. Use a simulação oficial de aposentadoria e solicite acertos necessários. A simulação não garante benefício.</p>${link(SOURCES.inss,'Abrir Meu INSS')}</div><div class="card"><h2>Contribuição autônoma · estimativa</h2><p>Plano normal: 20% sobre salário de contribuição, respeitados limites legais. Plano simplificado: 11% sobre salário mínimo quando elegível; possui limitações previdenciárias. MEI contribui via DAS; retenção por empresa pode alterar a forma de recolher. Não some guias sem verificar.</p><form onsubmit="event.preventDefault();let f=new FormData(this);$('inssResult').textContent='Estimativa aritmética: '+money(+f.get('base')*+f.get('rate')/100)+'. Confirme código, teto, mínimo e retenções no Meu INSS.'">${field('base','Base de contribuição (R$)',1621,'number')}${select('rate','Alíquota (%)',['20','11'],'20')}<button class="primary">Calcular</button></form><p id="inssResult"></p></div>`}
function business(){return `<h1>Gestão da empresa</h1><div class="card"><h2>Finanças do dono</h2><p>Registre pró-labore como remuneração pelo trabalho e avalie INSS/IR. Distribuição de lucros depende de apuração e suporte contábil, com regras tributárias próprias. Não classifique toda retirada como lucro isento. Gastos pessoais, aportes e reembolsos devem ser identificados.</p><button onclick="go('financas')">Registrar movimento</button></div><div class="card"><div class="row"><h2>Notas fiscais</h2><button onclick="noteForm()">+ Nota</button></div><p>NFS-e: serviços, com regras do emissor nacional/município. NF-e: operações com mercadorias. NFC-e: varejo ao consumidor conforme estado. O registro abaixo não emite documento fiscal nem lança receita automaticamente.</p>${link(SOURCES.nf,'Portal NFS-e')}<p>Para NF-e/NFC-e, consulte a SEFAZ do estado informado no diagnóstico.</p>${scoped('notes').map(x=>`<div class="item"><b>${esc(x.number)} · ${esc(x.kind)} · ${money(x.value)}</b><p>${esc(x.client)} · ${date(x.date)} · ${esc(x.status)}</p><button onclick="remove('notes','${x.id}')">Excluir</button></div>`).join('')||'<p class="muted">Nenhuma nota cadastrada.</p>'}</div><div class="card"><div class="row"><h2>Clientes e fornecedores</h2><button onclick="contactForm()">+ Contato</button></div>${scoped('contacts').map(x=>`<div class="item"><b>${esc(x.name)}</b> · ${esc(x.type)}<p>${esc(x.contact)}</p><button onclick="remove('contacts','${x.id}')">Excluir</button></div>`).join('')||'<p class="muted">Nenhum contato.</p>'}</div><div class="card"><div class="row"><h2>Funcionários</h2><button onclick="staffForm()">+ Colaborador</button></div><p>Provisões gerenciais; não substituem folha. Férias, 13º, encargos, benefícios e convenção coletiva exigem cálculo próprio. Colaboradores não atualizam automaticamente o diagnóstico.</p>${scoped('staff').map(x=>`<div class="item"><h3>${esc(x.name)}</h3><p>Salário ${money(x.salary)} · encargos estimados ${x.rate}% · benefícios ${money(x.benefits)}</p><p>13º (1/12): ${money(x.salary/12)} · férias + 1/3 (provisão bruta): ${money(x.salary/12*4/3)}.</p><p>Custo/provisões ilustrativos: ${money(x.salary*(1+x.rate/100)+x.benefits+x.salary/12+x.salary/12*4/3)}. Evite duplicar salário de férias nas provisões anuais.</p><p>Admissão: ${date(x.date)} · férias programadas: ${date(x.vacation)}</p><button onclick="remove('staff','${x.id}')">Excluir</button></div>`).join('')||'<p class="muted">Nenhum colaborador.</p>'}${link(SOURCES.esocial,'eSocial')} · ${link(SOURCES.fgts,'FGTS Digital')}</div>`}
function noteForm(){modal('Registrar nota fiscal',`${field('number','Número da nota')}${select('kind','Tipo',['NFS-e','NF-e','NFC-e'],'NFS-e')}${field('client','Cliente')}${field('value','Valor',0,'number')}${field('date','Emissão',today(),'date')}${select('status','Situação',['Emitida','Cancelada','Substituída'],'Emitida')}`,f=>{if(!f.get('number').trim()||+f.get('value')<=0)return false;db.notes.push({id:uid(),p:p(),number:f.get('number'),kind:f.get('kind'),client:f.get('client'),value:+f.get('value'),date:f.get('date'),status:f.get('status')})})}

function vault(){return `<h1>Cofre de documentos</h1><div class="card"><h2>${cryptKey?'Proteção por senha ativa':'Ative a proteção antes de guardar documentos'}</h2><p>${cryptKey?'O banco local é criptografado com AES-GCM. Arquivos são descriptografados somente na sessão desbloqueada.':'Os dados de demonstração estão em texto local. Para anexar documentos, configure uma senha que criptografa todo o banco.'}</p><p>Sem recuperação de senha. Use backup criptografado. O localStorage tem limite pequeno: anexos de até 700 KB por arquivo; reduza imagens e PDFs.</p>${!cryptKey?'<button class="primary" onclick="passwordSetup()">Configurar senha</button>':'<button class="primary" onclick="docForm()">+ Documento</button> <button onclick="lockApp()">Bloquear app</button>'}</div><div class="card">${scoped('docs').map(x=>`<div class="item"><h3>${esc(x.name)}</h3><p>${esc(x.cat)} · ${x.year} · vencimento: <span class="${x.expiry&&x.expiry<today()?'red':''}">${date(x.expiry)}</span></p><p>${x.expiry&&x.expiry<today()?'Documento vencido: verifique necessidade de renovação.':''}</p><button onclick="openDoc('${x.id}')">Baixar</button> <button onclick="remove('docs','${x.id}')" class="danger">Excluir</button></div>`).join('')||'<p>Nenhum documento guardado.</p>'}</div>`}
function docForm(){if(!cryptKey){passwordSetup();return}modal('Guardar documento',`${field('name','Nome do documento')}${select('cat','Categoria',['RG / CNH','Contrato social','Cartão CNPJ','Alvará / licença','Certidão','Informe IR','Nota fiscal','Outros'],'Certidão')}${field('year','Ano',today().slice(0,4),'number')}${field('expiry','Vencimento (opcional)','','date')}<label>Arquivo (até 700 KB)<input name="file" type="file" accept="image/png,image/jpeg,image/webp,application/pdf,text/plain" required></label>`,async f=>{let file=f.get('file');if(!f.get('name').trim()||!file.size||file.size>700*1024){toast('Informe nome e arquivo de até 700 KB.');return false}let data=await new Promise((res,rej)=>{let reader=new FileReader();reader.onload=()=>res(reader.result);reader.onerror=rej;reader.readAsDataURL(file)});db.docs.push({id:uid(),p:p(),name:f.get('name'),cat:f.get('cat'),year:f.get('year'),expiry:f.get('expiry'),filename:file.name,data})})}
function openDoc(id){let x=db.docs.find(x=>x.id===id);if(!cryptKey)return;let a=document.createElement('a');a.href=x.data;a.download=x.filename;a.click()}
function passwordSetup(){if(!crypto.subtle){toast('Criptografia requer HTTPS, como no GitHub Pages.');return}modal('Criar senha de bloqueio',`<p>A senha criptografa todos os dados locais. Não pode ser recuperada. Mínimo de 10 caracteres.</p>${field('pass','Nova senha','','password')}${field('again','Repetir senha','','password')}`,async f=>{let pass=f.get('pass');if(pass.length<10||pass!==f.get('again')){toast('Use pelo menos 10 caracteres e confirme a mesma senha.');return false}let salt=crypto.getRandomValues(new Uint8Array(16));cryptKey=await derive(pass,salt);envelope={salt:b64(salt)};return true})}
async function lockApp(){try{await writeQueue;if(cryptKey){cryptKey=null;db=null;lockScreen()}}catch(e){toast('Salvamento pendente falhou. Exporte antes de bloquear.')}}
function lockScreen(){document.querySelector('header').classList.add('hidden');$('nav').classList.add('hidden');$('app').innerHTML=`<div class="card" style="max-width:440px;margin:10vh auto"><div class="logo">✓</div><h1>Meu Contador</h1><p>Dados protegidos neste aparelho.</p><form id="unlock"><label>Senha<input id="unlockPass" type="password" autocomplete="current-password" required></label><button class="primary">Desbloquear</button></form><p class="sub">Sem recuperação de senha. Não apague os dados do navegador sem backup.</p><button onclick="encryptedBackup()">Exportar cópia criptografada</button></div>`;$('unlock').onsubmit=async e=>{e.preventDefault();try{let key=await derive($('unlockPass').value,un64(envelope.salt)),plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:un64(envelope.iv)},key,un64(envelope.data));db=JSON.parse(new TextDecoder().decode(plain));cryptKey=key;document.querySelector('header').classList.remove('hidden');$('nav').classList.remove('hidden');render()}catch(err){toast('Senha incorreta ou arquivo corrompido.')}}}
function assistant(){return `<h1>Assistente contador</h1><div class="card"><span class="tag">LOCAL · SEM IA GENERATIVA</span><p>Respostas por regras e base orientativa. Sem consulta ao seu CPF/CNPJ e sem acesso a dados atuais. Uma IA online exigiria servidor e envio de mensagens, fora deste formato local.</p><div class="actions">${['O que fazer hoje?','Como pagar DAS?','Carnê-Leão','INSS','Notas fiscais','Dívidas','Prazo e multa'].map(t=>`<button onclick="ask('${t}')">${t}</button>`).join('')}</div><div class="chat" id="chat">${db.chat.filter(x=>x.p===p()).map(x=>`<div class="bubble user">${esc(x.q)}</div><div class="bubble">${esc(x.a)}</div>`).join('')}</div><form onsubmit="event.preventDefault();ask(this.q.value);this.reset()"><label>Sua pergunta<input name="q" required maxlength="800" placeholder="Ex.: como regularizar uma dívida?"></label><button class="primary">Consultar base local</button></form></div>`}
function ask(q){if(!q.trim())return;let t=q.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''),a;if(/hoje|plano|semana/.test(t))a='Hoje: '+plan().slice(0,2).map(x=>x.name).join('; ')+'. Esta semana: confira a Agenda e documentos. Este mês: concilie receitas/despesas e verifique os portais oficiais.';else if(/das|mei|simples/.test(t))a='DAS é a guia do MEI/Simples. Apure no PGMEI (MEI) ou PGDAS-D (Simples). Vencimento mensal de referência: dia 20, sujeito a calendário e prorrogações. Em atraso, reemita no sistema para juros e multa corretos. A declaração anual é separada. Portal: '+SOURCES.simples;else if(/carne|exterior/.test(t))a='Carnê-Leão é a apuração mensal de rendimentos tributáveis recebidos de PF/exterior quando sujeitos. Registre no Carnê-Leão Web e emita DARF quando devido. Prazo usual: último dia útil do mês seguinte. Em atraso, atualize no sistema oficial. Use Tributos para estimativa, sem substituir apuração oficial. '+SOURCES.ir;else if(/inss|aposent|cnis/.test(t))a='Baixe o CNIS no Meu INSS, confira vínculos e contribuições e solicite ajustes. Autônomo: contribuição e código dependem de atividade, base e retenções. Não pague guia duplicada. Aposentadoria exige análise de idade, tempo e regras de transição. '+SOURCES.inss;else if(/nota|nfse|nfs/.test(t))a='Serviço: confira NFS-e nacional/municipal. Mercadoria: NF-e e NFC-e conforme SEFAZ. Registre notas na área Empresa; o app não emite nota fiscal. Exigência e prazo dependem da operação. '+SOURCES.nf;else if(/divida|parcel|pgfn/.test(t))a='Primeiro obtenha extrato e identifique o credor. Débito federal na Receita: consulte seu portal; dívida ativa: Regularize/PGFN; estado/município: SEFAZ/prefeitura; FGTS: canais correspondentes. Priorize riscos imediatos e juros altos. Opções e multas dependem da dívida. '+SOURCES.pgfn;else if(/prazo|multa|fgts|esocial/.test(t))a='Não existe multa ou prazo único. A Agenda traz referências para revisão, não atesta vencimentos legais. Confirme competência, obrigação, feriados e prorrogações no portal; gere guia atualizada para juros/multa e cadastre a data confirmada. FGTS: '+SOURCES.fgts;else if(/irpf|imposto de renda|restitu|declar/.test(t))a='A obrigação de declarar depende de todos os critérios do exercício, não apenas do salário. Reúna informes, bens, dependentes, operações e recibos. Consulte processamento, pendências e restituição no Meu Imposto de Renda. A simulação em Tributos usa ano-base 2026 / exercício 2027. '+SOURCES.ir;else a='Dados insuficientes para verificar esta pergunta na base local. Consulte o órgão competente e um contador com os documentos e período envolvidos. Posso orientar sobre DAS, Carnê-Leão, IRPF, notas, INSS, dívidas e plano de ação. '+SOURCES.receita;db.chat.push({p:p(),q,a});save();render();$('chat')?.scrollTo(0,999999)}
function reports(){let s=stats(),rows=scoped('tx').filter(x=>x.date.startsWith(db.reportMonth)),year=db.reportMonth.slice(0,4),annual=scoped('tx').filter(x=>x.date.startsWith(year)&&x.kind==='Receita'&&x.cat==='Faturamento').reduce((a,x)=>a+x.value,0);return `<h1>Relatórios</h1><label>Mês<input type="month" value="${db.reportMonth}" onchange="changeMonth(this.value)"></label><div class="actions"><button class="primary" onclick="window.print()">Imprimir / Salvar PDF</button><button onclick="exportCSV()">Exportar planilha CSV</button></div><div class="card"><h2>Resumo mensal · ${db.reportMonth}</h2><p>Perfil: ${esc(info().name)} · Recebido: ${money(s.r)} · Pago: ${money(s.e)} · Saldo: ${money(s.s)}</p><p>Faturamento anual ${year} (competência, categoria Faturamento): ${money(annual)}</p><p>Impostos: estimativa básica ${estimate(s.r)===null?'não apurada':money(estimate(s.r))}. Demais apurações devem ser conferidas nos sistemas oficiais.</p><div class="scroll"><table><thead><tr><th>Descrição</th><th>Data</th><th>Natureza / categoria</th><th>Valor</th><th>Baixa</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${date(x.date)}</td><td>${esc(x.kind)} / ${esc(x.cat)}</td><td>${money(x.value)}</td><td>${x.paid?'Sim':'Não'}</td></tr>`).join('')}</tbody></table></div></div><div class="card"><h2>Preparação para Imposto de Renda</h2><p>Relatório gerencial; não é declaração nem informe fiscal.</p><p>Documentos no cofre deste perfil: ${scoped('docs').map(x=>esc(x.name)+' ('+x.year+')').join(', ')||'Nenhum'}.</p><p>Dívidas registradas: ${money(scoped('debts').reduce((s,x)=>s+x.value,0))}.</p><p>Os saldos e custos de bens/investimentos não são apurados por este relatório. Reúna informes e documentos externos para declaração.</p></div><div class="card"><h2>Pendências</h2>${plan().map(x=>`<p>□ ${esc(x.name)} — ${esc(x.status)}</p>`).join('')}${obligations().filter(x=>!done(x)).map(x=>`<p>□ ${esc(x.name)} · ${date(x.date)}${x.estimated?' (referência)':''}</p>`).join('')}</div>`}
function download(content,name,type){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function exportCSV(){let rows=[['Meu Contador',info().name,db.reportMonth],['TIPO','DESCRIÇÃO','DATA','VALOR','CATEGORIA','STATUS']];scoped('tx').filter(x=>x.date.startsWith(db.reportMonth)).forEach(x=>rows.push([x.kind,x.name,x.date,x.value.toFixed(2).replace('.',','),x.cat,x.paid?'Realizado':'Pendente']));rows.push([],['PENDÊNCIAS']);plan().forEach(x=>rows.push(['Checklist',x.name,'','','',x.status]));obligations().filter(x=>!done(x)).forEach(x=>rows.push(['Obrigação',x.name,x.date,'','',x.estimated?'Confirmar prazo':'Pendente']));rows.push([],['DÍVIDAS']);scoped('debts').forEach(x=>rows.push(['Dívida',x.name,x.date,x.value.toFixed(2).replace('.',','),x.organ,'Em aberto']));rows.push([],['FATURAMENTO ANUAL POR MÊS',db.reportMonth.slice(0,4)]);for(let m=1;m<=12;m++){let ym=db.reportMonth.slice(0,4)+'-'+String(m).padStart(2,'0'),v=scoped('tx').filter(x=>x.date.startsWith(ym)&&x.kind==='Receita'&&x.cat==='Faturamento').reduce((s,x)=>s+x.value,0);rows.push(['Faturamento',ym,'',v.toFixed(2).replace('.',',')])}let safe=v=>{let t=String(v??'');if(/^[=+\-@\t\r]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"'};download('\ufeff'+rows.map(r=>r.map(safe).join(';')).join('\r\n'),'meu-contador-'+p()+'-'+db.reportMonth+'.csv','text/csv;charset=utf-8')}
function more(){return `<h1>Ferramentas</h1><div class="grid">${[['tributos','∑','Tributos e simuladores'],['cofre','▣','Cofre de documentos'],['assistente','✧','Assistente local'],['relatorios','▤','Relatórios'],['dividas','≋','Dívidas'],[p()==='pf'?'inss':'empresa','▥',p()==='pf'?'INSS e CNIS':'Empresa e funcionários'],['config','⚙','Segurança e backup']].map(x=>`<button class="card" style="text-align:left" onclick="go('${x[0]}')"><div style="font-size:25px;color:var(--green)">${x[1]}</div>${x[2]}</button>`).join('')}</div>`}
function settings(){return `<h1>Configurações</h1><div class="card"><h2>Segurança local</h2><p>${cryptKey?'Banco criptografado; senha exigida na próxima abertura.':'Senha ainda não configurada. Dados locais sem criptografia.'}</p><div class="actions"><button class="primary" onclick="passwordSetup()">${cryptKey?'Alterar':'Criar'} senha</button>${cryptKey?'<button onclick="lockApp()">Bloquear agora</button>':''}<button onclick="theme()">Alternar tema</button></div><p>Biometria não está implementada: autenticação WebAuthn com recuperação segura exige infraestrutura adicional. Use a senha do app e o bloqueio do aparelho.</p><p>Após 5 minutos sem interação, a sessão protegida é bloqueada. O aplicativo não transmite dados; abrir um link oficial leva você ao site externo.</p></div><div class="card"><h2>Backup e restauração</h2><p>Dados ficam neste navegador/aparelho e não sincronizam. Limpar o navegador, trocar de endereço ou perder o aparelho pode eliminar os dados. Backup sem senha contém dados pessoais em texto; proteja o arquivo.</p><div class="actions"><button onclick="backup()">Exportar backup ${cryptKey?'criptografado':'JSON'}</button><button onclick="restoreDialog()">Restaurar backup</button><button onclick="clearExamples()">Remover lançamentos de exemplo</button></div></div><div class="card"><h2>Instalar no iPhone</h2><p>Abra o link HTTPS no Safari → Compartilhar → Adicionar à Tela de Início. O manifest e o ícone são embutidos.</p><p>Este formato não inclui service worker: o cache offline e notificações com app fechado não são garantidos. A instalação pelo menu do Safari pode funcionar independentemente do reconhecimento do manifest embutido.</p></div><div class="card"><h2>Limites e atualização fiscal</h2><p>O app não consulta Receita, INSS, FGTS ou órgãos locais; não emite guias, não envia declarações e não atesta regularidade. Assistente é uma base local de regras. Todas as confirmações são manuais.</p><p>Base de cálculo: 2026. Valores anuais IRPF para exercício 2027. MEI comum, sem casos especiais. O comparador de empresa é parametrizado; Para empresa não MEI, o painel informa “A apurar”; use o simulador parametrizado e valide a apuração oficial.</p>${Object.entries(SOURCES).map(([k,v])=>`<p>${link(v,k)}</p>`).join('')}</div>`}
async function backup(){await writeQueue;download(localStorage.getItem(KEY),cryptKey?'meu-contador-protegido.json':'meu-contador-backup.json','application/json')}
function encryptedBackup(){download(JSON.stringify(envelope),'meu-contador-protegido.json','application/json')}
function restoreDialog(){modal('Restaurar backup',`<p>Substitui os dados atuais. Faça um backup antes. Escolha apenas arquivo exportado por este aplicativo.</p><label>Backup JSON<input name="file" type="file" accept=".json,application/json" required></label>`,async f=>{let file=f.get('file');if(!file||file.size>10*1024*1024){toast('Arquivo inválido ou acima de 10 MB.');return false}let candidate=JSON.parse(await file.text());if(candidate.locked){if(!candidate.salt||!candidate.iv||!candidate.data)throw Error('Backup protegido inválido.')}else validate(candidate);if(!confirm('Substituir todos os dados por este backup?'))return false;await writeQueue;localStorage.setItem(KEY,JSON.stringify(candidate));location.reload();return false})}
function validate(x){if(x.version!==1||!['pf','pj'].includes(x.p)||!x.profiles?.pf||!x.profiles?.pj||!x.checks?.pf||!x.checks?.pj||!x.done)throw Error('Formato de backup inválido.');for(let key of ['tx','tasks','debts','docs','notes','contacts','staff','chat'])if(!Array.isArray(x[key]))throw Error('Coleção inválida: '+key);for(let key of ['tx','tasks','debts','docs','notes','contacts','staff'])for(let v of x[key]){if(!['pf','pj'].includes(v.p)||typeof v.id!=='string'||!/^[\w:-]+$/.test(v.id))throw Error('Registro inválido.');if(v.date&&!/^\d{4}-\d{2}-\d{2}$/.test(v.date))throw Error('Data inválida.');if(v.value!==undefined&&(!Number.isFinite(v.value)||v.value<0))throw Error('Valor inválido.')}for(let task of x.tasks)if(task.url&&!/^https:\/\//.test(task.url))throw Error('Link inválido.');for(let xdoc of x.docs)if(!/^data:(image\/(png|jpeg|webp)|application\/pdf|text\/plain);base64,/.test(xdoc.data))throw Error('Tipo de documento inválido.');if(!/^\d{4}-\d{2}$/.test(x.reportMonth))throw Error('Mês inválido.')}
function clearExamples(){if(!confirm('Remover somente os três lançamentos fictícios iniciais?'))return;db.tx=db.tx.filter(x=>!['ex1','ex2','ex3'].includes(x.id));save();render()}
// Manifest e ícone locais, sem dependências. Safari aceita instalação manual sem service worker.
const icon='<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192"><rect width="192" height="192" rx="40" fill="#102b46"/><rect x="40" y="32" width="112" height="128" rx="20" fill="#08785e"/><path d="M66 98l21 21 40-47" fill="none" stroke="white" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/></svg>',iconURI='data:image/svg+xml,'+encodeURIComponent(icon);let manifest={name:'Meu Contador',short_name:'Meu Contador',start_url:location.pathname,scope:location.pathname.replace(/[^/]*$/,''),display:'standalone',background_color:'#eff4f8',theme_color:'#102b46',icons:[{src:iconURI,sizes:'192x192',type:'image/svg+xml',purpose:'any'}]};let ml=document.createElement('link');ml.rel='manifest';ml.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(manifest));document.head.append(ml);let al=document.createElement('link');al.rel='apple-touch-icon';al.href=iconURI;document.head.append(al);
// Ícone PNG gerado localmente para melhor compatibilidade iOS.
let im=new Image();im.onload=()=>{let canvas=document.createElement('canvas');canvas.width=canvas.height=192;canvas.getContext('2d').drawImage(im,0,0);al.href=canvas.toDataURL('image/png')};im.src=iconURI;
let lastActivity=Date.now();for(let ev of ['pointerdown','keydown','touchstart'])document.addEventListener(ev,()=>lastActivity=Date.now(),{passive:true});setInterval(()=>{if(cryptKey&&Date.now()-lastActivity>300000){$('modal').close();lockApp()}},15000);
async function boot(){try{let raw=localStorage.getItem(KEY);if(raw){let parsed=JSON.parse(raw);if(parsed.locked){envelope=parsed;lockScreen();return}validate(parsed);db=parsed}else{db=fresh();await save()}render()}catch(err){$('app').innerHTML='<div class="card"><h1>Não foi possível abrir os dados</h1><p>O armazenamento pode estar indisponível ou corrompido. Os dados existentes não foram substituídos. Tente abrir no Safari normal, fora da navegação privada.</p></div>'}}boot();
